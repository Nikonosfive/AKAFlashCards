<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKA Flashcards</title>
  <style>
    h1,
    a {
      color: #fff;
    }

    #overlay,
    #cardListOverlay {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100vw;
      height: 100vh;
      visibility: hidden;
      opacity: 0;
      background: rgba(0, 0, 0, 0.5);
      transition: all 0.5s ease-out;
    }

    #overlay.overlay-on,
    #cardListOverlay.overlay-on {
      visibility: visible;
      opacity: 1;
    }

    .flex {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      align-content: center;
    }

    .overlay-inner {
      padding: 20px 20px;
      background-color: #27acd9;
      text-align: center;
      margin: 10px;
      border-radius: 30px;
      border: 1px solid #38bdfa;
      box-shadow: 12px 12px 2px 1px rgba(0, 0, 0, 0.2);
    }

    .topmargin {
      display: inline-block;
      vertical-align: middle;
      align-items: center;
    }

    .settings {
      margin: 14px;
      align-items: center;
      vertical-align: middle;
    }
    
    button{
      cursor: pointer;
    }

    button.button {
      display: relative;
      text-align: center;
      vertical-align: middle;
      text-decoration: none;
      width: auto;
      min-width: 60px;
      margin: auto;
      padding: 1.0rem 0.7rem;
      font-weight: bold;
      border: 2px solid #27acd9;
      color: #27acd9;
      border-radius: 50vh;
      transition: 0.5s;
    }

    button.button:hover {
      color: #fff;
      background: #27acd9;
      border: 2px solid #fff;
    }

    button.button-left {
      display: relative;
      text-align: center;
      vertical-align: middle;
      text-decoration: none;
      width: auto;
      min-width: 60px;
      margin: auto;
      padding: 1.0rem 0.7rem;
      font-weight: bold;
      border: 2px solid #27acd9;
      color: #27acd9;
      border-radius: 50vh 10vh 10vh 50vh;
      transition: 0.5s;
    }

    button.button-left:hover {
      color: #fff;
      background: #27acd9;
      border: 2px solid #fff;
    }

    button.button-right {
      display: relative;
      text-align: center;
      vertical-align: middle;
      text-decoration: none;
      width: auto;
      min-width: 60px;
      margin: auto;
      padding: 1.0rem 0.7rem;
      font-weight: bold;
      border: 2px solid #27acd9;
      color: #27acd9;
      border-radius: 10vh 50vh 50vh 10vh;
      transition: 0.5s;
    }

    button.button-right:hover {
      color: #fff;
      background: #27acd9;
      border: 2px solid #fff;
    }

    button.button-rev {
      display: relative;
      text-align: center;
      vertical-align: middle;
      text-decoration: none;
      width: auto;
      min-width: 60px;
      margin: auto;
      padding: 0.3rem 0.7rem;
      font-weight: bold;
      border: 2px solid white;
      color: white;
      background: #27acd9;
      border-radius: 50vh;
      transition: 0.5s;
    }

    button.button-rev:hover {
      color: #27acd9;
      background: white;
      border: 2px solid #27acd9;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #27acd9;
      padding: 10px;
    }

    #display {
      font-size: 2em;
      margin-top: 20px;
      height: 60vh;
      text-align: center;
      align-content: center;
      padding: 20px;
      overflow: scroll;
      background-color: #fff;
      border-radius: 50px;
      cursor: pointer;
    }

    #display.element2 {
      background-color: #f8d7da;
    }

    input,
    select {
      border-radius: 100vh;
      padding: 4px;
      padding-left: 15px;
      border-color: #27acd9;
      margin: 6px;
      border: 1px solid #fff;
      cursor: pointer;
    }

    label {
      color: #fff;
      font-weight: 600;
    }

    #cardNumber {
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      padding: 5px;
      vertical-align: middle;
      align-items: center;
    }

    #cardList {
      max-height: 70vh;
      overflow-y: auto;
      text-align: left;
      background-color: #fff;
      border-radius: 20px;
      padding: 10px;
    }

    #cardList table {
      width: 100%;
      border-collapse: collapse;
      cursor: pointer;
    }

    #cardList table,
    #cardList th,
    #cardList td {
      border: 1px solid #27acd9;
    }

    #cardList th,
    #cardList td {
      padding: 8px;
      text-align: left;
    }
    
    .ranges {
      width: 70%;
      height: 0.15rem;
      appearance: none;
      border-radius: 0.2rem;
      background-color: white;
      margin: 0.2rem;
      cursor: pointer;
      padding: 0px;
    }

    .ranges::-webkit-slider-thumb {
      appearance: none;
      background-color: white;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      vertical-align: middle;
    }

    .ranges::-webkit-slider-thumb:hover {
      scale: 1.05;
    }
  </style>
</head>

<body>
  <a><b>AKAフラッシュカード</b>　範囲：アメリカ大統領の軌跡</a>
  <div id="display"></div>
  <div class="settings">
    <span id="cardNumber"></span>
    <button id="showSettingsButton" class="button-rev">設定</button>
    <button id="showCardListButton" class="button-rev">一覧表示</button>
  </div>
  <center>
    <br>
    <button id="startButton" class="button">▶</button>
    <button id="pauseButton" class="button">一時停止</button>
    <button id="prevButton" class="button-left">戻る</button>
    <button id="nextButton" class="button-right">進む</button>
    <br>
  </center>
  <div id="overlay">
    <div class="flex">
      <div class="overlay-inner">
        <label for="interval1" class="topmargin">表の表示時間（秒）</label>
        <input type="number" id="interval1" value="1.5">
        <br>
        <label for="interval2">裏の表示時間（秒）</label>
        <input type="number" id="interval2" value="1.5">
        <br>
        <label for="cssValue">文字の大きさ</label>
        <input type="range" id="cssValue" min="0" max="8" step="0.1" value="2" class="ranges" />
        <script>
          document.getElementById("cssValue").addEventListener("input", function() {
            const property = "font-size";
            const value = this.value;
            if (property && value) {
              display.style[property] = value + "rem";
            }
          });
        </script>
        <br>
        <label for="order">並べ替え</label>
        <select id="order">
          <option value="sequential">番号順</option>
          <option value="random">ランダム</option>
        </select>
        <br>
        <br>
        <a style="font-size: 0.8rem">AKA Flashcards by TADR <b>Ver.E(2025.2.2)</b></a>
        <br>
        <br>
        <button id="closeSettingsButton" class="button" type="button">✕</button>
      </div>
    </div>
  </div>
  <div id="cardListOverlay">
    <div class="flex">
      <div class="overlay-inner">
        <div id="cardList"></div>
        <br>
        <button id="closeCardListButton" class="button" type="button">✕</button>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const overlay = document.getElementById('overlay');
      const cardListOverlay = document.getElementById('cardListOverlay');
      document.getElementById('showSettingsButton').addEventListener('click', function() {
        overlay.classList.add('overlay-on');
      });
      document.getElementById('closeSettingsButton').addEventListener('click', function() {
        overlay.classList.remove('overlay-on');
      });
      document.getElementById('showCardListButton').addEventListener('click', function() {
        cardListOverlay.classList.add('overlay-on');
        displayCardList();
      });
      document.getElementById('closeCardListButton').addEventListener('click', function() {
        cardListOverlay.classList.remove('overlay-on');
      });
      displayCurrentElement(); // ページ読み込み時に最初のカードを表示
    });
    const csvString = `1,1947　トルーマン・ドクトリン,トルーマン
2,1947　マーシャル・プラン,トルーマン
3,1948　米州機構成立,トルーマン
4,1949　NATO成立,トルーマン
5,1950　朝鮮戦争参戦,トルーマン
6,1946〜　インドシナ戦争でフランスを支持,トルーマン
7,巻き返し政策・雪解け,アイゼンハウアー
8,1953　朝鮮戦争休戦,アイゼンハウアー
9,1954　第五福竜丸事件,アイゼンハウアー
10,1955　ジュネーヴ四巨頭会談,アイゼンハウアー
11,1957　スプートニク・ショック,アイゼンハウアー
12,1959　キャンプ・デービッド会談（フルシチョフ訪米）,アイゼンハウアー
13,1960　U2型機事件,アイゼンハウアー
14,1961　ベルリンの壁建築,ケネディ
15,1962　キューバ危機,ケネディ
16,1963　部分的核実験禁止条約,ケネディ
17,1964　公民権法,ジョンソン
18,1965　北爆開始,ジョンソン
19,1968　核拡散防止条約,ジョンソン
20,1968　キング牧師暗殺,ジョンソン
21,キッシンジャー外交,ニクソン
22,1971　ドル・ショック（金・ドル交換停止）,ニクソン
23,1972　ニクソン訪中,ニクソン
24,1972　第一次戦略兵器制限交渉,ニクソン
25,1973　パリ和平協定,ニクソン
26,人権外交,カーター
27,1977　新パナマ運河条約,カーター
28,1979　米中国交正常化,カーター
29,1979　第二次戦略兵器制限交渉,カーター
30,1979　エジプト・イスラエル平和条約,カーター
31,1979　イラン革命,カーター
32,強いアメリカ,レーガン
33,1983　グレナダ侵攻,レーガン
34,1985　プラザ合意,レーガン
35,1987　中距離核戦力全廃条約,レーガン
36,1988　ゴルバチョフ訪米・レーガン訪ソ,レーガン
37,1989　パナマに軍事介入,父ブッシュ
38,1989　マルタ会談,父ブッシュ
39,1991　湾岸戦争,父ブッシュ
40,1991　第一次戦略兵器削減条約,父ブッシュ
41,1991　中東和平会議,父ブッシュ
42,1993　パレスチナ暫定自治協定,クリントン
43,対テロ戦争,子ブッシュ
44,2001　同時多発テロ,子ブッシュ
45,2003　イラク侵攻（イラク戦争）,子ブッシュ
46,2009　核廃絶演説（「核なき世界」）,オバマ
47,2015　米・キューバ国交回復,オバマ`;

    function parseCSV(csv) {
      const lines = csv.split('\n');
      const result = [];
      for (const line of lines) {
        const values = line.split(',');
        if (values.length >= 3) {
          result.push({
            id: values[0],
            question: values[1],
            answer: values[2]
          });
        }
      }
      return result;
    }
    const elements = parseCSV(csvString);
    const display = document.getElementById('display');
    const cardNumber = document.getElementById('cardNumber');
    let currentIndex = 0;
    let interval1 = 1500;
    let interval2 = 1500;
    let order = 'sequential';
    let isPaused = true;
    let intervalId;
    let showingElement2 = false;

    function displayElement(element) {
      display.textContent = element.question;
      display.classList.remove('element2');
      cardNumber.textContent = `カード番号：${element.id}`;
    }

    function displayElement2(element) {
      display.textContent = element.answer;
      display.classList.add('element2');
    }

    function displayNextElement() {
      currentIndex = (currentIndex + 1) % elements.length;
      displayCurrentElement();
    }

    function displayPrevElement() {
      currentIndex = (currentIndex - 1 + elements.length) % elements.length;
      displayCurrentElement();
    }

    function displayCurrentElement() {
      showingElement2 = false;
      const element = elements[currentIndex];
      displayElement(element);
    }

    function start() {
      isPaused = false;
      let currentInterval = interval1;
      intervalId = setInterval(function() {
        if (!showingElement2) {
          const element = elements[currentIndex];
          displayElement2(element);
          showingElement2 = true;
          currentInterval = interval2;
        } else {
          displayNextElement();
          showingElement2 = false;
          currentInterval = interval1;
        }
        clearInterval(intervalId);
        intervalId = setInterval(arguments.callee, currentInterval);
      }, currentInterval);
    }

    function pause() {
      isPaused = true;
      clearInterval(intervalId);
    }
    display.addEventListener('click', function() {
      if (isPaused) {
        if (!showingElement2) {
          showingElement2 = true;
          displayElement2(elements[currentIndex]);
        } else {
          displayNextElement();
          showingElement2 = false;
        }
      }
    });
    document.getElementById('startButton').addEventListener('click', start);
    document.getElementById('pauseButton').addEventListener('click', pause);
    document.getElementById('prevButton').addEventListener('click', displayPrevElement);
    document.getElementById('nextButton').addEventListener('click', displayNextElement);
    document.getElementById('interval1').addEventListener('input', function(event) {
      interval1 = event.target.value * 1000;
    });
    document.getElementById('interval2').addEventListener('input', function(event) {
      interval2 = event.target.value * 1000;
    });
    document.getElementById('order').addEventListener('change', function(event) {
      order = event.target.value;
      if (order === 'random') {
        shuffleArray(elements);
      } else {
        elements.sort((a, b) => a.id - b.id);
      }
      currentIndex = 0;
      displayCurrentElement();
    });

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function displayCardList() {
      const cardList = document.getElementById('cardList');
      cardList.innerHTML = '';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tbody = document.createElement('tbody');
      const headerRow = document.createElement('tr');
      const headerCell1 = document.createElement('th');
      const headerCell2 = document.createElement('th');
      const headerCell3 = document.createElement('th');
      headerCell1.textContent = '番号';
      headerCell2.textContent = '質問';
      headerCell3.textContent = '答え';
      headerRow.appendChild(headerCell1);
      headerRow.appendChild(headerCell2);
      headerRow.appendChild(headerCell3);
      thead.appendChild(headerRow);
      table.appendChild(thead);
      elements.forEach((element, index) => {
        const row = document.createElement('tr');
        const cell1 = document.createElement('td');
        const cell2 = document.createElement('td');
        const cell3 = document.createElement('td');
        cell1.textContent = element.id;
        cell2.textContent = element.question;
        cell3.textContent = element.answer;
        row.appendChild(cell1);
        row.appendChild(cell2);
        row.appendChild(cell3);
        row.addEventListener('click', function() {
          currentIndex = index;
          displayCurrentElement();
          cardListOverlay.classList.remove('overlay-on');
        });
        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      cardList.appendChild(table);
    }
    document.addEventListener('keydown', function(event) {
      if (event.key === ' ' || event.key === 'ArrowRight') {
        if (isPaused) {
          if (!showingElement2) {
            showingElement2 = true;
            displayElement2(elements[currentIndex]);
          } else {
            displayNextElement();
            showingElement2 = false;
          }
        }
      } else if (event.key === 'ArrowLeft') {
        if (intervalId) clearInterval(intervalId);
        displayPrevElement();
      }
    });
  </script>
</body>

</html>
